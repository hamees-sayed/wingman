name: Wingman

options:
  bundleIdPrefix: ai.wingman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Wingman:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Wingman
        excludes:
          - Info.plist
    info:
      # Generated by XcodeGen from the properties below; do not edit the file by hand.
      path: Wingman/Info.plist
      properties:
        CFBundleDisplayName: Wingman
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Wingman listens to your conversations so it can remember them for you and whisper what you need.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts:
          - Geist.ttf
          - GeistMono.ttf
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.wingman.app
        PRODUCT_NAME: Wingman
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: minimal
