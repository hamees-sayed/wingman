[project]
name = "wingman"
version = "0.1.0"
description = "Listens to your conversations and whispers one useful line only when you need it."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=14",
    "httpx>=0.27",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "sherpa-onnx>=2.0.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
